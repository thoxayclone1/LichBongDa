name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen & Generate Project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project LichThiDau.xcodeproj \
            -scheme LichThiDau \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LichThiDau.app Payload/
          zip -r9 LichThiDau_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichThiDau-TrollStore-IPA
          path: LichThiDau_TrollStore.ipa
